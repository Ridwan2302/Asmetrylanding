<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<meta name="robots" content="noindex" />

<style>
  :root {
    --ink: #0b0b0c;
    --gray-on-dark: rgba(255,255,255,0.62);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--ink);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 28px;
    text-align: center;
  }
  a { color: inherit; }
  .check-badge {
    width: 64px; height: 64px; margin: 0 auto 20px;
    border-radius: 50%;
    background: rgba(52, 199, 89, 0.16);
    display: flex; align-items: center; justify-content: center;
  }
  .check-badge svg { width: 30px; height: 30px; }
  .title { font-size: clamp(22px, 4.5vw, 28px); font-weight: 800; letter-spacing: -0.3px; }
  .body { margin-top: 10px; font-size: 15px; line-height: 1.5; color: var(--gray-on-dark); max-width: 40ch; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
    padding: 16px 34px;
    border-radius: 999px;
    text-decoration: none;
    background: #fff;
    color: #000;
    width: 100%;
    max-width: 340px;
  }
  .btn:active { transform: scale(0.97); }
  .cta { margin-top: 30px; }
</style>
</head>
<body>

<div class="check-badge">
  <svg viewBox="0 0 24 24" fill="none" stroke="#34c759" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
</div>
<div class="title" id="title">Merci pour votre achat !</div>
<p class="body" id="body">Votre accès à vie à Asmetry est confirmé.</p>
<div class="cta">
  <a class="btn" href="https://asmetryapp.vercel.app/home" id="cta-btn">Installer Asmetry</a>
</div>

<script>
  var TEXT = {
    en: { title: "Thank you for your purchase!", body: "Your lifetime access to Asmetry is confirmed.", cta: "Install Asmetry" },
    fr: { title: "Merci pour votre achat !", body: "Votre accès à vie à Asmetry est confirmé.", cta: "Installer Asmetry" }
  };
  var savedLang = null;
  try { savedLang = localStorage.getItem('asmetry_landing_lang'); } catch (e) {}
  var lang = savedLang === 'en' ? 'en' : 'fr';
  var t = TEXT[lang];
  document.documentElement.lang = lang;
  document.getElementById('title').textContent = t.title;
  document.getElementById('body').textContent = t.body;
  document.getElementById('cta-btn').textContent = t.cta;
</script>
</body>
</html>
