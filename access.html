<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Asmetry — 1$ puis gratuit pour toujours.</title>
<meta name="description" content="Payez 1 $ une seule fois et Asmetry est à vous pour toujours — sans abonnement." />
<meta name="theme-color" content="#0b0b0c" />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
<noscript><style>.reveal { opacity: 1 !important; transform: none !important; }</style></noscript>

<style>
  :root {
    --ink: #0b0b0c;
    --white: #ffffff;
    --gray: #6e6e73;
    --gray-dim: #98989d;
    --line: rgba(0,0,0,0.08);
    --line-dark: rgba(255,255,255,0.14);
    --gray-on-dark: rgba(255,255,255,0.62);
    --glass-bg: rgba(255,255,255,0.08);
    --glass-border: rgba(255,255,255,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--ink);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    min-height: 100vh;
  }
  img { display: block; max-width: 100%; }
  a { color: inherit; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 24px; }

  nav { padding: 20px 0; }
  nav .wrap { max-width: 1120px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand-name { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
  .back-link { font-size: 13px; font-weight: 600; color: var(--gray-on-dark); text-decoration: none; }

  .pay-hero { padding: 40px 0 120px; text-align: center; }
  h1.pay-title {
    font-size: clamp(20px, 3.2vw, 26px);
    line-height: 1.3;
    font-weight: 700;
    letter-spacing: -0.3px;
    max-width: 24ch;
    margin: 0 auto;
  }
  .price-block { margin-top: 40px; }
  .price-main {
    font-size: clamp(64px, 12vw, 100px);
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 1;
  }
  .price-sub { margin-top: 8px; font-size: 15px; color: var(--gray-on-dark); letter-spacing: 0.2px; }
  .pay-lead {
    margin: 22px auto 0;
    font-size: clamp(15px, 1.6vw, 17px);
    line-height: 1.6;
    color: var(--gray-on-dark);
    max-width: 42ch;
  }
  .cta-row { margin-top: 36px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 600;
    padding: 16px 34px;
    border-radius: 999px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-light { background: #fff; color: #000; }
  .btn-dark { background: var(--ink); border: 1.5px solid #fff; color: #fff; }
  .btn-wide { width: 100%; max-width: 340px; }
  .micro { font-size: 12px; color: var(--gray-on-dark); letter-spacing: 0.2px; }

  .success-panel { margin-top: 32px; }

  /* Low-key phone number field — hidden until the visitor clicks "Payer" once */
  .phone-field {
    margin-top: 0;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    display: flex;
    justify-content: center;
    transition: max-height 0.35s ease, opacity 0.3s ease, margin-top 0.35s ease;
  }
  .phone-field.show { max-height: 60px; opacity: 1; margin-top: 16px; }
  .phone-input {
    width: 100%;
    max-width: 280px;
    padding: 11px 18px;
    border-radius: 999px;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    color: #fff;
    font-size: 13px;
    text-align: center;
    outline: none;
    font-family: inherit;
  }
  .phone-input::placeholder { color: var(--gray-on-dark); }
  .phone-input:focus { border-color: rgba(255,255,255,0.4); }

  /* Divider between the two options ("— ou —") */
  .or-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 30px auto 0;
    max-width: 220px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gray-on-dark);
  }
  .or-divider::before, .or-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line-dark);
  }

  /* Waiting state, replacing the "Alternative gratuite" button on this page */
  .wait-block { margin-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .spinner {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 3px solid var(--glass-bg);
    border-top-color: #fff;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .reveal { opacity: 0; transform: translateY(22px); transition: opacity 0.7s ease, transform 0.7s ease; }
  .reveal.in { opacity: 1; transform: translateY(0); }

  footer { padding: 40px 0 32px; border-top: 1px solid var(--line-dark); }
  footer .wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .footer-fine { font-size: 12px; color: var(--gray-on-dark); }

  @media (max-width: 480px) {
    .pay-hero { padding: 32px 0 88px; }
  }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <div class="brand-name">Asmetry</div>
    <a class="back-link" href="index.html" data-i18n="back_link">← Retour au site</a>
  </div>
</nav>

<header class="pay-hero">
  <div class="wrap reveal">
    <h1 class="pay-title" data-i18n="pay_hero">1$ puis gratuit pour toujours.</h1>

    <div class="price-block">
      <div class="price-main">$1</div>
      <div class="price-sub">≈ 616 <span data-i18n="price_currency">FCFA (Côte d'Ivoire)</span></div>
    </div>

    <p class="pay-lead" data-i18n="pay_lead">Obtenez un accès à vie à Asmetry avec un paiement unique de 1 $. Aucun abonnement. Aucun paiement récurrent.</p>

    <div class="cta-row">
      <a class="btn btn-dark btn-wide" id="pay-btn" href="https://pay.jeko.africa/pr/7798b36c-1623-4fa8-9fc3-397e6d319953" target="_blank" rel="noopener" data-i18n="pay_cta">Payer</a>
    </div>

    <div class="phone-field" id="phone-field">
      <input type="tel" id="phone-input" class="phone-input" inputmode="tel" autocomplete="tel" />
    </div>

    <div class="success-panel" id="pay-success-panel" style="display:none;">
      <a class="btn btn-dark btn-wide" id="open-app-btn" href="https://asmetryapp.vercel.app/home" data-i18n="install_app_cta">Installer Asmetry</a>
    </div>

    <div class="or-divider" id="or-divider" data-i18n="or_divider">ou</div>
    <div class="wait-block">
      <div class="spinner"></div>
      <span class="micro" data-i18n="waiting_label">En attente de validation</span>
    </div>
  </div>
</header>

<footer>
  <div class="wrap">
    <div class="footer-fine">© <span id="year"></span> Asmetry. <span data-i18n="footer_rights">Tous droits réservés.</span></div>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  var translations = {
    en: {
      back_link: "← Back to site",
      pay_hero: "$1 once, then free forever.",
      price_currency: "FCFA (Côte d'Ivoire)",
      pay_lead: "Get lifetime access to Asmetry with a one-time $1 payment. No subscription. No recurring payments.",
      pay_cta: "Pay",
      phone_placeholder: "Phone number (optional, e.g. +225 07 00 00 00 00)",
      or_divider: "or",
      waiting_label: "Awaiting validation",
      install_app_cta: "Install Asmetry",
      footer_rights: "All rights reserved."
    },
    fr: {
      back_link: "← Retour au site",
      pay_hero: "1$ puis gratuit pour toujours.",
      price_currency: "FCFA (Côte d'Ivoire)",
      pay_lead: "Obtenez un accès à vie à Asmetry avec un paiement unique de 1 $. Aucun abonnement. Aucun paiement récurrent.",
      pay_cta: "Payer",
      phone_placeholder: "Numéro (facultatif, ex: +225 07 00 00 00 00)",
      or_divider: "ou",
      waiting_label: "En attente de validation",
      install_app_cta: "Installer Asmetry",
      footer_rights: "Tous droits réservés."
    }
  };

  // No language switcher on this page — it simply follows whatever language the visitor
  // already chose on the main site (same "asmetry_landing_lang" key), defaulting to French.
  var savedLang = null;
  try { savedLang = localStorage.getItem('asmetry_landing_lang'); } catch (e) {}
  var lang = savedLang === 'en' ? 'en' : 'fr';
  var dict = translations[lang];
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    var key = el.getAttribute('data-i18n');
    if (dict[key]) el.textContent = dict[key];
  });
  document.documentElement.lang = lang;
  document.getElementById('phone-input').placeholder = dict.phone_placeholder;

  // Fade sections in as they come into view (same motion language as index.html).
  var revealEls = document.querySelectorAll('.reveal');
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) entry.target.classList.add('in');
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -8% 0px' });
  revealEls.forEach(function (el) { io.observe(el); });
  setTimeout(function () { revealEls.forEach(function (el) { el.classList.add('in'); }); }, 2500);

  // "Payer" opens the Jèko payment link immediately, on the first click — no gate, no
  // typing required first. The phone field appears alongside it at the same time, purely
  // optional: filling it in will later unlock the app automatically once the payment backend
  // is wired in; skipping it just falls back to the click-count reveal below.
  var payBtn = document.getElementById('pay-btn');
  var paySuccessPanel = document.getElementById('pay-success-panel');
  var phoneField = document.getElementById('phone-field');
  var phoneInput = document.getElementById('phone-input');
  var phoneRevealed = false;

  // Temporary: after the visitor has followed the payment link a few times, reveal the app
  // link. This click-count placeholder will be replaced by a real payment confirmation
  // (phone number checked against the Jèko webhook) once that backend is wired in.
  var REQUIRED_CLICKS = 3;
  var payClicks = 0;
  payBtn.addEventListener('click', function (e) {
    if (!phoneRevealed) {
      phoneRevealed = true;
      phoneField.classList.add('show');
    }
    payClicks++;
    if (payClicks >= REQUIRED_CLICKS) {
      e.preventDefault();
      payBtn.style.display = 'none';
      phoneField.style.display = 'none';
      paySuccessPanel.style.display = 'block';
    }
  });
</script>
</body>
</html>
