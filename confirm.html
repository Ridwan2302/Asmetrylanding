<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Asmetry — Confirmation</title>
<meta name="description" content="Confirmez votre paiement pour recevoir Asmetry." />
<meta name="theme-color" content="#0b0b0c" />
<meta name="robots" content="noindex" />
<noscript><style>.reveal { opacity: 1 !important; transform: none !important; }</style></noscript>

<style>
  :root {
    --ink: #0b0b0c;
    --line-dark: rgba(255,255,255,0.14);
    --gray-on-dark: rgba(255,255,255,0.62);
    --glass-bg: rgba(255,255,255,0.08);
    --glass-border: rgba(255,255,255,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--ink);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  a { color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 24px; }

  nav { padding: 20px 0; }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand-name { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
  .back-link { font-size: 13px; font-weight: 600; color: var(--gray-on-dark); text-decoration: none; }

  .confirm-hero { padding: 60px 0 100px; text-align: center; }
  h1.confirm-title {
    font-size: clamp(22px, 4.2vw, 28px);
    line-height: 1.3;
    font-weight: 700;
    letter-spacing: -0.3px;
    max-width: 22ch;
    margin: 0 auto;
  }
  .confirm-lead {
    margin: 14px auto 0;
    font-size: 15px;
    line-height: 1.6;
    color: var(--gray-on-dark);
    max-width: 38ch;
  }

  .phone-field { margin-top: 30px; display: flex; justify-content: center; }
  .phone-input {
    width: 100%;
    max-width: 280px;
    padding: 13px 18px;
    border-radius: 999px;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    color: #fff;
    font-size: 15px;
    text-align: center;
    outline: none;
    font-family: inherit;
  }
  .phone-input::placeholder { color: var(--gray-on-dark); }
  .phone-input:focus { border-color: rgba(255,255,255,0.4); }
  .phone-input.invalid { border-color: #ff6b6b; }

  .cta-row { margin-top: 18px; display: flex; justify-content: center; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 600;
    padding: 15px 30px;
    border-radius: 999px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-dark { background: var(--ink); border: 1.5px solid #fff; color: #fff; }
  .btn-wide { width: 100%; max-width: 280px; }

  .success-panel { margin-top: 32px; }

  .reveal { opacity: 0; transform: translateY(22px); transition: opacity 0.7s ease, transform 0.7s ease; }
  .reveal.in { opacity: 1; transform: translateY(0); }

  footer { padding: 40px 0 32px; border-top: 1px solid var(--line-dark); }
  footer .wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .footer-fine { font-size: 12px; color: var(--gray-on-dark); }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <div class="brand-name">Asmetry</div>
    <a class="back-link" href="unlock.html" data-i18n="back_link">← Retour</a>
  </div>
</nav>

<header class="confirm-hero">
  <div class="wrap reveal">
    <h1 class="confirm-title" data-i18n="confirm_title">Vous venez de payer ?</h1>
    <p class="confirm-lead" data-i18n="confirm_lead">Entrez le numéro utilisé pour le paiement afin de recevoir Asmetry.</p>

    <div id="confirm-form">
      <div class="phone-field">
        <input type="tel" id="phone-input" class="phone-input" inputmode="tel" autocomplete="tel" />
      </div>
      <div class="cta-row">
        <button class="btn btn-dark btn-wide" id="confirm-btn" data-i18n="confirm_cta">Confirmer</button>
      </div>
    </div>

    <div class="success-panel" id="success-panel" style="display:none;">
      <a class="btn btn-dark btn-wide" id="open-app-btn" href="https://asmetryapp.vercel.app/home" data-i18n="install_app_cta">Installer Asmetry</a>
    </div>
  </div>
</header>

<footer>
  <div class="wrap">
    <div class="footer-fine">© <span id="year"></span> Asmetry. <span data-i18n="footer_rights">Tous droits réservés.</span></div>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  var translations = {
    en: {
      back_link: "← Back",
      confirm_title: "Just paid?",
      confirm_lead: "Enter the number you used to pay to receive Asmetry.",
      phone_placeholder: "Phone number (e.g. +225 07 00 00 00 00)",
      confirm_cta: "Confirm",
      install_app_cta: "Install Asmetry",
      footer_rights: "All rights reserved."
    },
    fr: {
      back_link: "← Retour",
      confirm_title: "Vous venez de payer ?",
      confirm_lead: "Entrez le numéro utilisé pour le paiement afin de recevoir Asmetry.",
      phone_placeholder: "Numéro de téléphone (ex: +225 07 00 00 00 00)",
      confirm_cta: "Confirmer",
      install_app_cta: "Installer Asmetry",
      footer_rights: "Tous droits réservés."
    }
  };

  var savedLang = null;
  try { savedLang = localStorage.getItem('asmetry_landing_lang'); } catch (e) {}
  var lang = savedLang === 'en' ? 'en' : 'fr';
  var dict = translations[lang];
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    var key = el.getAttribute('data-i18n');
    if (dict[key]) el.textContent = dict[key];
  });
  document.documentElement.lang = lang;
  document.getElementById('phone-input').placeholder = dict.phone_placeholder;

  var revealEls = document.querySelectorAll('.reveal');
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) entry.target.classList.add('in');
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -8% 0px' });
  revealEls.forEach(function (el) { io.observe(el); });
  setTimeout(function () { revealEls.forEach(function (el) { el.classList.add('in'); }); }, 2500);

  function isValidPhone(value) {
    var digits = value.replace(/[\s-]/g, '');
    return /^(\+?225)?\d{10}$/.test(digits);
  }

  var phoneInput = document.getElementById('phone-input');
  var confirmForm = document.getElementById('confirm-form');
  var successPanel = document.getElementById('success-panel');

  phoneInput.addEventListener('input', function () {
    phoneInput.classList.remove('invalid');
  });

  // Interim behavior: a valid-looking number reveals the app link right away. This will be
  // replaced by a real check against the Jèko webhook once that backend is wired in — same
  // number, no page change needed on our end at that point.
  document.getElementById('confirm-btn').addEventListener('click', function () {
    if (!isValidPhone(phoneInput.value)) {
      phoneInput.classList.add('invalid');
      phoneInput.focus();
      return;
    }
    confirmForm.style.display = 'none';
    successPanel.style.display = 'block';
  });
</script>
</body>
</html>
