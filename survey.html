<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Asmetry — Sondage</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0b0b0c" />

<noscript><style>.reveal { opacity: 1 !important; transform: none !important; }</style></noscript>

<style>
  :root {
    --ink: #0b0b0c;
    --gray-on-dark: rgba(255,255,255,0.62);
    --glass-bg: rgba(255,255,255,0.08);
    --glass-border: rgba(255,255,255,0.18);
    --line-dark: rgba(255,255,255,0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--ink);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
  }
  a { color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 24px; }

  nav { padding: 20px 0; }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand-name { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
  .back-link { font-size: 13px; font-weight: 600; color: var(--gray-on-dark); text-decoration: none; }

  main { padding: 12px 0 80px; }

  .intro-title { font-size: clamp(22px, 4.5vw, 28px); font-weight: 800; letter-spacing: -0.3px; }
  .intro-lead { margin-top: 8px; font-size: 14px; line-height: 1.5; color: var(--gray-on-dark); }

  .question-block { margin-top: 34px; }
  .q-num { font-size: 12px; font-weight: 700; letter-spacing: 0.3px; color: var(--gray-on-dark); }
  .q-title { margin-top: 6px; font-size: clamp(17px, 3.4vw, 20px); font-weight: 700; line-height: 1.3; letter-spacing: -0.2px; }

  .options { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-radius: 14px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    cursor: pointer;
    font-size: 15px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .option:active { transform: scale(0.99); }
  .option.selected { background: rgba(255,255,255,0.16); border-color: #fff; }
  .option .dot { flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--gray-on-dark); position: relative; }
  .option.selected .dot { border-color: #fff; }
  .option.selected .dot::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: #fff; }

  .nav-row { margin-top: 36px; display: flex; justify-content: center; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 600;
    padding: 15px 30px;
    border-radius: 999px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; pointer-events: none; }
  .btn-light { background: #fff; color: #000; }
  .btn-wide { width: 100%; max-width: 340px; }

  .center-state { text-align: center; padding: 60px 0; }
  .spinner {
    width: 40px; height: 40px; margin: 0 auto 22px;
    border-radius: 50%;
    border: 3px solid var(--glass-bg);
    border-top-color: #fff;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .check-badge {
    width: 64px; height: 64px; margin: 0 auto 20px;
    border-radius: 50%;
    background: rgba(52, 199, 89, 0.16);
    display: flex; align-items: center; justify-content: center;
  }
  .check-badge svg { width: 30px; height: 30px; }

  .done-title { font-size: clamp(22px, 4.5vw, 28px); font-weight: 800; letter-spacing: -0.3px; }
  .done-body { margin-top: 10px; font-size: 15px; line-height: 1.5; color: var(--gray-on-dark); max-width: 40ch; margin-left: auto; margin-right: auto; }
  .done-cta { margin-top: 30px; display: flex; justify-content: center; }

  .reveal { opacity: 0; transform: translateY(22px); transition: opacity 0.7s ease, transform 0.7s ease; }
  .reveal.in { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <div class="brand-name">Asmetry</div>
    <a class="back-link" href="unlock.html" data-i18n="back_link">← Retour</a>
  </div>
</nav>

<main class="wrap">
  <div id="quiz-view" class="reveal">
    <h1 class="intro-title" data-i18n="intro_title">Un petit sondage</h1>
    <p class="intro-lead" data-i18n="intro_lead">3 questions rapides, puis votre accès gratuit.</p>

    <div id="questions-list"></div>

    <div class="nav-row">
      <button class="btn btn-light btn-wide" id="submit-btn" disabled data-i18n="submit_cta">Valider</button>
    </div>
  </div>

  <div id="loading-view" class="center-state" style="display:none;">
    <div class="spinner"></div>
    <div data-i18n="validating">Validation du sondage…</div>
  </div>

  <div id="done-view" class="center-state" style="display:none;">
    <div class="check-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="#34c759" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
    </div>
    <div class="done-title" data-i18n="done_title">Sondage validé</div>
    <p class="done-body" data-i18n="done_body">Merci pour vos réponses.</p>
    <div class="done-cta">
      <a class="btn btn-light btn-wide" href="unlock.html" data-i18n="validated_cta">Validé</a>
    </div>
  </div>
</main>

<script>
  var translations = {
    en: {
      back_link: "← Back",
      intro_title: "A quick survey",
      intro_lead: "3 quick questions, then your free access.",
      submit_cta: "Submit",
      validating: "Validating your answers…",
      done_title: "Survey validated",
      done_body: "Thanks for your answers.",
      validated_cta: "Validated"
    },
    fr: {
      back_link: "← Retour",
      intro_title: "Un petit sondage",
      intro_lead: "3 questions rapides, puis votre accès gratuit.",
      submit_cta: "Valider",
      validating: "Validation du sondage…",
      done_title: "Sondage validé",
      done_body: "Merci pour vos réponses.",
      validated_cta: "Validé"
    }
  };

  var QUESTIONS = {
    en: [
      { title: "Which social platform do you use the most?", options: ["TikTok", "Instagram", "Snapchat", "YouTube", "Other"] },
      { title: "Have you ever compared your appearance to people you see online?", options: ["Never", "Rarely", "Sometimes", "Often"] },
      { title: "Would you be interested in an app that analyzes your face and builds you a personalized plan?", options: ["Yes, definitely", "Maybe", "No"] }
    ],
    fr: [
      { title: "Quel réseau social utilisez-vous le plus souvent ?", options: ["TikTok", "Instagram", "Snapchat", "YouTube", "Autre"] },
      { title: "Vous est-il déjà arrivé de comparer votre apparence à celle de personnes vues en ligne ?", options: ["Jamais", "Rarement", "Parfois", "Souvent"] },
      { title: "Seriez-vous intéressé(e) par une application qui analyse votre visage et vous propose un plan personnalisé ?", options: ["Oui, beaucoup", "Peut-être", "Non"] }
    ]
  };

  var savedLang = null;
  try { savedLang = localStorage.getItem('asmetry_landing_lang'); } catch (e) {}
  var lang = savedLang === 'en' ? 'en' : 'fr';
  var t = translations[lang];
  var questions = QUESTIONS[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    var key = el.getAttribute('data-i18n');
    if (t[key]) el.textContent = t[key];
  });

  var answers = [];
  var list = document.getElementById('questions-list');
  var submitBtn = document.getElementById('submit-btn');

  function allAnswered() {
    return answers.length === questions.length && answers.every(function (a) { return a !== undefined; });
  }

  questions.forEach(function (q, qi) {
    var block = document.createElement('div');
    block.className = 'question-block';

    var num = document.createElement('div');
    num.className = 'q-num';
    num.textContent = 'Question ' + (qi + 1) + ' / ' + questions.length;
    block.appendChild(num);

    var title = document.createElement('div');
    title.className = 'q-title';
    title.textContent = q.title;
    block.appendChild(title);

    var optionsWrap = document.createElement('div');
    optionsWrap.className = 'options';
    q.options.forEach(function (label, oi) {
      var opt = document.createElement('div');
      opt.className = 'option';
      opt.innerHTML = '<span class="dot"></span><span>' + label + '</span>';
      opt.addEventListener('click', function () {
        answers[qi] = oi;
        Array.prototype.forEach.call(optionsWrap.children, function (el) { el.classList.remove('selected'); });
        opt.classList.add('selected');
        submitBtn.disabled = !allAnswered();
      });
      optionsWrap.appendChild(opt);
    });
    block.appendChild(optionsWrap);

    list.appendChild(block);
  });

  submitBtn.addEventListener('click', function () {
    if (!allAnswered()) return;
    document.getElementById('quiz-view').style.display = 'none';
    document.getElementById('loading-view').style.display = 'block';
    // Short, honest validation delay — not a simulated failure. Always resolves.
    setTimeout(function () {
      document.getElementById('loading-view').style.display = 'none';
      document.getElementById('done-view').style.display = 'block';
    }, 1400);
  });

  var revealEls = document.querySelectorAll('.reveal');
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) entry.target.classList.add('in');
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -8% 0px' });
  revealEls.forEach(function (el) { io.observe(el); });
  setTimeout(function () { revealEls.forEach(function (el) { el.classList.add('in'); }); }, 2500);

  // "Validé" just leads to the payment page, where the existing Payer flow is the actual
  // unlock step for this free-alternative path too.
</script>
</body>
</html>
