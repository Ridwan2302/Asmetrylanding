<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Asmetry — Sondage</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0b0b0c" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />

<style>
  :root {
    --ink: #0b0b0c;
    --gray-on-dark: rgba(255,255,255,0.62);
    --glass-bg: rgba(255,255,255,0.08);
    --glass-border: rgba(255,255,255,0.18);
    --line-dark: rgba(255,255,255,0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--ink);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
  }
  a { color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 24px; }

  nav { padding: 20px 0; }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand-name { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
  .back-link { font-size: 13px; font-weight: 600; color: var(--gray-on-dark); text-decoration: none; }

  main { padding: 24px 0 80px; }

  .progress-track { height: 4px; border-radius: 999px; background: var(--glass-bg); overflow: hidden; }
  .progress-fill { height: 100%; background: #fff; border-radius: 999px; transition: width 0.35s ease; }
  .progress-label { margin-top: 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.3px; color: var(--gray-on-dark); }

  .q-title { margin-top: 28px; font-size: clamp(20px, 4vw, 26px); font-weight: 700; line-height: 1.3; letter-spacing: -0.2px; }

  .options { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px 18px;
    border-radius: 14px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    cursor: pointer;
    font-size: 15px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .option:active { transform: scale(0.99); }
  .option.selected { background: rgba(255,255,255,0.16); border-color: #fff; }
  .option .dot { flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--gray-on-dark); position: relative; }
  .option.selected .dot { border-color: #fff; }
  .option.selected .dot::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: #fff; }

  .nav-row { margin-top: 32px; display: flex; gap: 12px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 600;
    padding: 15px 30px;
    border-radius: 999px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; pointer-events: none; }
  .btn-light { background: #fff; color: #000; flex: 1; }
  .btn-ghost { background: var(--glass-bg); border: 1px solid var(--glass-border); color: #fff; }
  .btn-wide { width: 100%; max-width: 340px; }

  .center-state { text-align: center; padding: 60px 0; }
  .spinner {
    width: 40px; height: 40px; margin: 0 auto 22px;
    border-radius: 50%;
    border: 3px solid var(--glass-bg);
    border-top-color: #fff;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .check-badge {
    width: 64px; height: 64px; margin: 0 auto 20px;
    border-radius: 50%;
    background: rgba(52, 199, 89, 0.16);
    display: flex; align-items: center; justify-content: center;
  }
  .check-badge svg { width: 30px; height: 30px; }

  .done-title { font-size: clamp(22px, 4.5vw, 28px); font-weight: 800; letter-spacing: -0.3px; }
  .done-body { margin-top: 10px; font-size: 15px; line-height: 1.5; color: var(--gray-on-dark); max-width: 40ch; margin-left: auto; margin-right: auto; }
  .done-cta { margin-top: 30px; display: flex; justify-content: center; }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <div class="brand-name">Asmetry</div>
    <a class="back-link" href="unlock.html" data-i18n="back_link">← Retour</a>
  </div>
</nav>

<main class="wrap">
  <div id="quiz-view">
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="progress-label" id="progress-label"></div>
    <div class="q-title" id="q-title"></div>
    <div class="options" id="q-options"></div>
    <div class="nav-row">
      <button class="btn btn-light" id="next-btn" disabled data-i18n="next">Suivant</button>
    </div>
  </div>

  <div id="loading-view" class="center-state" style="display:none;">
    <div class="spinner"></div>
    <div data-i18n="validating">Validation du sondage…</div>
  </div>

  <div id="done-view" class="center-state" style="display:none;">
    <div class="check-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="#34c759" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
    </div>
    <div class="done-title" data-i18n="done_title">Sondage validé</div>
    <p class="done-body" data-i18n="done_body">Merci pour vos réponses.</p>
    <div class="done-cta">
      <a class="btn btn-light btn-wide" href="access.html" data-i18n="validated_cta">Validé</a>
    </div>
  </div>
</main>

<script>
  var translations = {
    en: {
      back_link: "← Back",
      next: "Next",
      validating: "Validating your answers…",
      done_title: "Survey validated",
      done_body: "Thanks for your answers.",
      validated_cta: "Validated",
      q_label: "Question",
      q_of: "of"
    },
    fr: {
      back_link: "← Retour",
      next: "Suivant",
      validating: "Validation du sondage…",
      done_title: "Sondage validé",
      done_body: "Merci pour vos réponses.",
      validated_cta: "Validé",
      q_label: "Question",
      q_of: "sur"
    }
  };

  var QUESTIONS = {
    en: [
      { title: "How much time do you spend on social media per day, on average?", options: ["Less than 1 hour", "1 to 3 hours", "3 to 5 hours", "More than 5 hours"] },
      { title: "Which social platform do you use the most?", options: ["TikTok", "Instagram", "Snapchat", "YouTube", "Other"] },
      { title: "Have you ever compared your appearance to people you see online?", options: ["Never", "Rarely", "Sometimes", "Often"] },
      { title: "Would you be interested in an app that analyzes your face and builds you a personalized plan?", options: ["Yes, definitely", "Maybe", "No"] }
    ],
    fr: [
      { title: "Combien de temps passez-vous en moyenne sur les réseaux sociaux chaque jour ?", options: ["Moins d'1 heure", "1 à 3 heures", "3 à 5 heures", "Plus de 5 heures"] },
      { title: "Quel réseau social utilisez-vous le plus souvent ?", options: ["TikTok", "Instagram", "Snapchat", "YouTube", "Autre"] },
      { title: "Vous est-il déjà arrivé de comparer votre apparence à celle de personnes vues en ligne ?", options: ["Jamais", "Rarement", "Parfois", "Souvent"] },
      { title: "Seriez-vous intéressé(e) par une application qui analyse votre visage et vous propose un plan personnalisé ?", options: ["Oui, beaucoup", "Peut-être", "Non"] }
    ]
  };

  var savedLang = null;
  try { savedLang = localStorage.getItem('asmetry_landing_lang'); } catch (e) {}
  var lang = savedLang === 'en' ? 'en' : 'fr';
  var t = translations[lang];
  var questions = QUESTIONS[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    var key = el.getAttribute('data-i18n');
    if (t[key]) el.textContent = t[key];
  });

  var current = 0;
  var answers = [];
  var qTitle = document.getElementById('q-title');
  var qOptions = document.getElementById('q-options');
  var nextBtn = document.getElementById('next-btn');
  var progressFill = document.getElementById('progress-fill');
  var progressLabel = document.getElementById('progress-label');

  function renderQuestion() {
    var q = questions[current];
    qTitle.textContent = q.title;
    qOptions.innerHTML = '';
    q.options.forEach(function (label, i) {
      var opt = document.createElement('div');
      opt.className = 'option';
      if (answers[current] === i) opt.classList.add('selected');
      opt.innerHTML = '<span class="dot"></span><span>' + label + '</span>';
      opt.addEventListener('click', function () {
        answers[current] = i;
        renderQuestion();
      });
      qOptions.appendChild(opt);
    });
    nextBtn.disabled = answers[current] === undefined;
    nextBtn.textContent = current === questions.length - 1 ? (lang === 'fr' ? 'Valider' : 'Submit') : t.next;
    progressFill.style.width = Math.round(((current) / questions.length) * 100) + '%';
    progressLabel.textContent = t.q_label + ' ' + (current + 1) + ' ' + t.q_of + ' ' + questions.length;
  }

  nextBtn.addEventListener('click', function () {
    if (answers[current] === undefined) return;
    if (current < questions.length - 1) {
      current++;
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      finishSurvey();
    }
  });

  function finishSurvey() {
    document.getElementById('quiz-view').style.display = 'none';
    document.getElementById('loading-view').style.display = 'block';
    // Short, honest validation delay — not a simulated failure. Always resolves.
    setTimeout(function () {
      document.getElementById('loading-view').style.display = 'none';
      document.getElementById('done-view').style.display = 'block';
    }, 1400);
  }

  // "Validé" just leads to the payment page, where the existing pay-btn 3-click
  // reveal (already in place there) is the actual unlock step.

  renderQuestion();
</script>
</body>
</html>
