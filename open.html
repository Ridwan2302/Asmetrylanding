<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Asmetry</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0b0b0c" />

<style>
  :root {
    --ink: #0b0b0c;
    --gray-on-dark: rgba(255,255,255,0.62);
    --glass-bg: rgba(255,255,255,0.08);
    --glass-border: rgba(255,255,255,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--ink);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 28px;
    text-align: center;
  }
  .badge {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin-bottom: 20px;
  }
  .title { font-size: 19px; font-weight: 700; letter-spacing: -0.2px; max-width: 26ch; }
  .body { margin: 10px 0 26px; font-size: 14px; line-height: 1.6; color: var(--gray-on-dark); max-width: 32ch; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
    padding: 16px 34px;
    border-radius: 999px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    background: #fff;
    color: #000;
    width: 100%;
    max-width: 340px;
  }
  .btn:active { transform: scale(0.97); }
  .copied { margin-top: 12px; font-size: 13px; color: var(--gray-on-dark); visibility: hidden; }
</style>
</head>
<body>

<div id="stuck" style="display:none;">
  <div class="badge">↗</div>
  <div class="title" id="stuck-title">Ouvrez ce lien dans votre navigateur</div>
  <p class="body" id="stuck-body">Appuyez sur ⋯ en haut de l'écran, puis choisissez « Ouvrir dans le navigateur ».</p>
  <button type="button" class="btn" id="copy-btn">Copier le lien</button>
  <div class="copied" id="copied">Lien copié !</div>
</div>

<script>
  var TEXT = {
    en: {
      title: "Open this link in your browser",
      body: "Tap ⋯ at the top of the screen, then choose “Open in browser”.",
      copy: "Copy link",
      copied: "Link copied!"
    },
    fr: {
      title: "Ouvrez ce lien dans votre navigateur",
      body: "Appuyez sur ⋯ en haut de l'écran, puis choisissez « Ouvrir dans le navigateur ».",
      copy: "Copier le lien",
      copied: "Lien copié !"
    }
  };
  var lang = 'fr';
  try { lang = localStorage.getItem('asmetry_landing_lang') === 'en' ? 'en' : 'fr'; } catch (e) {}
  var t = TEXT[lang];

  // Where this link should ultimately send people — defaults to the main site,
  // but a bio link can override it with ?to=/unlock.html etc.
  var params = new URLSearchParams(location.search);
  var to = params.get('to') || 'index.html';
  // Only allow same-site relative paths — never redirect through this page to an arbitrary
  // external URL someone appended to the query string.
  if (/^(https?:)?\/\//i.test(to) || to.indexOf('..') !== -1) to = 'index.html';
  var destination = new URL(to, location.href).href;

  var ua = navigator.userAgent || '';
  var isInApp = /musical_ly|TikTok|BytedanceWebview|FBAN|FBAV|Instagram|Line\/|MicroMessenger|Snapchat/i.test(ua);

  if (!isInApp) {
    location.replace(destination);
  } else if (/Android/i.test(ua)) {
    // Android in-app browsers hand off "intent://" links to a real browser automatically.
    var noScheme = destination.replace(/^https?:\/\//, '');
    var fallback = encodeURIComponent(destination);
    location.href = 'intent://' + noScheme + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + fallback + ';end;';
    showStuck(); // shown only if the intent hand-off doesn't fire
  } else {
    // iOS (and anything else) has no equivalent auto-escape — guide the visitor instead.
    showStuck();
  }

  function showStuck() {
    document.getElementById('stuck-title').textContent = t.title;
    document.getElementById('stuck-body').textContent = t.body;
    document.getElementById('copy-btn').textContent = t.copy;
    document.getElementById('copied').textContent = t.copied;
    document.getElementById('stuck').style.display = 'block';

    document.getElementById('copy-btn').addEventListener('click', function () {
      copyText(destination, function () {
        var copied = document.getElementById('copied');
        copied.style.visibility = 'visible';
        setTimeout(function () { copied.style.visibility = 'hidden'; }, 2500);
      });
    });
  }

  function copyText(text, onDone) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(onDone).catch(function () { legacyCopy(text, onDone); });
    } else {
      legacyCopy(text, onDone);
    }
  }
  function legacyCopy(text, onDone) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    onDone();
  }
</script>
</body>
</html>
