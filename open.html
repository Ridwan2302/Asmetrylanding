<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Asmetry</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0b0b0c" />

<style>
  :root {
    --ink: #0b0b0c;
    --gray-on-dark: rgba(255,255,255,0.62);
    --glass-bg: rgba(255,255,255,0.08);
    --glass-border: rgba(255,255,255,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--ink);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 28px;
    text-align: center;
  }
  .badge {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin-bottom: 20px;
  }
  .title { font-size: 19px; font-weight: 700; letter-spacing: -0.2px; max-width: 26ch; }
  .body { margin: 10px 0 26px; font-size: 14px; line-height: 1.6; color: var(--gray-on-dark); max-width: 32ch; }
</style>
</head>
<body>

<div id="stuck" style="display:none;">
  <div class="badge">↗</div>
  <div class="title" id="stuck-title">Ouvrez ce lien dans votre navigateur</div>
  <p class="body" id="stuck-body">Appuyez sur les trois points ⋯ en haut de l'écran, puis choisissez « Ouvrir dans le navigateur ».</p>
</div>

<script>
  var TEXT = {
    en: {
      title: "Open this link in your browser",
      body: "Tap the three dots ⋯ at the top of the screen, then choose “Open in browser”."
    },
    fr: {
      title: "Ouvrez ce lien dans votre navigateur",
      body: "Appuyez sur les trois points ⋯ en haut de l'écran, puis choisissez « Ouvrir dans le navigateur »."
    }
  };
  var lang = 'fr';
  try { lang = localStorage.getItem('asmetry_landing_lang') === 'en' ? 'en' : 'fr'; } catch (e) {}
  var t = TEXT[lang];

  // Where this link should ultimately send people — defaults to the main site,
  // but a bio link can override it with ?to=/unlock.html etc.
  var params = new URLSearchParams(location.search);
  var to = params.get('to') || 'index.html';
  // Only allow same-site relative paths — never redirect through this page to an arbitrary
  // external URL someone appended to the query string.
  if (/^(https?:)?\/\//i.test(to) || to.indexOf('..') !== -1) to = 'index.html';
  var destination = new URL(to, location.href).href;

  var ua = navigator.userAgent || '';
  var isInApp = /musical_ly|TikTok|BytedanceWebview|FBAN|FBAV|Instagram|Line\/|MicroMessenger|Snapchat/i.test(ua);

  if (!isInApp) {
    location.replace(destination);
  } else {
    // No automatic escape attempt (Android's "intent://" hand-off throws a native
    // "Action can't be completed" error in some in-app browsers) — go straight to
    // clear manual instructions instead.
    showStuck();
  }

  function showStuck() {
    document.getElementById('stuck-title').textContent = t.title;
    document.getElementById('stuck-body').textContent = t.body;
    document.getElementById('stuck').style.display = 'block';
  }
</script>
</body>
</html>
